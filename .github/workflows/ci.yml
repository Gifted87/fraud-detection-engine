name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          DB_URL: postgres://postgres:postgres@localhost:5432/fraud_engine
          REDIS_URL: redis://localhost:6379
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || 'test-key' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'test-key' }}
          CRYPTO_SALT: ${{ secrets.CRYPTO_SALT || 'test-salt' }}
          PUBLIC_KEY_PEM: ${{ secrets.PUBLIC_KEY_PEM || 'test-pub' }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM || 'test-priv' }}

      - name: Build Docker Image
        run: docker build -t fraud-detection-engine:${{ github.sha }} .
